name: cygwin

on: workflow_dispatch

jobs:
  fedora-build:
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-pc-cygwin
          pkgarch: 64
    name: Fedora cross ${{ matrix.target }}

    env:
      HAS_SSH_KEY: ${{ secrets.SSH_KEY != '' }}

    steps:
    - uses: actions/checkout@v3

    - name: Install build tools
      run: |
        dnf install -y autoconf automake gawk make patch perl mingw${{ matrix.pkgarch }}-gcc-c++ mingw${{ matrix.pkgarch }}-winpthreads-static mingw${{ matrix.pkgarch }}-zlib-static

    - name: Enable 'dnf copr'
      run: |
        dnf install -y dnf-plugins-core

    - name: Install cross-cygwin toolchain and libs and cocom from copr
      run: |
        dnf copr enable -y yselkowitz/cygwin
        dnf install -y cygwin${{ matrix.pkgarch }}-gcc-c++ cygwin${{ matrix.pkgarch }}-gettext cygwin${{ matrix.pkgarch }}-libbfd cygwin${{ matrix.pkgarch }}-libiconv cygwin${{ matrix.pkgarch }}-zlib cocom

    - name: Install doc tools
      run: |
        dnf install -y dblatex docbook2X docbook-xsl xmlto python3 python3-lxml python3-ply openssh-clients
        fmtutil-sys --byfmt pdflatex && texhash

    - name: Configure, build and install
      run: |
        mkdir build install
        (cd winsup && ./autogen.sh)
        (cd build && ../configure \
          --target=${{ matrix.target }} \
          --prefix=$(realpath $(pwd)/../install) \
          CFLAGS="-D__MSYS__" \
          CXXFLAGS="-D__MSYS__ -Wno-error=unused-but-set-variable" \
          CCASFLAGS="-D__MSYS__" \
          MINGW_CXXFLAGS="-Wno-error=unused-but-set-variable" )
        make -C build
        make -C build/*/newlib info man
        make -C build install
        make -C build/*/newlib install-info install-man

    - name: Deploy documentation
      env:
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      run: |
        case "${{ github.ref }}" in
          refs/heads/main)
            DEST='preview'
            ;;
          refs/tags/cygwin-[0-9.]*)
            DEST='stable'
            ;;
          *)
            exit 0
            ;;
        esac
        unset HOME
        mkdir -p ~/.ssh/
        echo "cygwin.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKoejTnTCbXaIIMYfbX7t4tYUOQ2bTxZC3e/td3BageF" >> ~/.ssh/known_hosts
        ssh-agent -a $SSH_AUTH_SOCK > /dev/null
        ssh-add - <<< "${{ secrets.SSH_KEY }}"
        scp -pr build/*/winsup/doc/{cygwin-api,cygwin-ug-net,faq} cygwin-admin@cygwin.com:/sourceware/www/sourceware/htdocs/cygwin/doc/${DEST}/
      if: env.HAS_SSH_KEY == 'true'

  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-pc-cygwin
          pkgarch: x86_64
    name: Windows native ${{ matrix.pkgarch }}

    steps:
    - run: git config --global core.autocrlf input

    - uses: actions/checkout@v4

    - name: adjust permissions
      run: |
        icacls . /inheritance:r
        icacls . /grant Administrators:F
        icacls . /grant "BUILTIN\Users:F"

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        update: true
        install: >-
          msys2-devel
          base-devel
          autotools
          cocom
          dejagnu
          diffutils
          gcc
          gettext-devel
          libiconv-devel
          libzstd-devel
          make
          mingw-w64-cross-crt
          mingw-w64-cross-gcc
          mingw-w64-cross-zlib
          patch
          perl
          zlib-devel
          xmlto
          docbook-xsl
          git

    - name: Build
      shell: msys2 {0}
      run: |
        mkdir build install
        (cd winsup && ./autogen.sh)
        cd build
        ../configure \
          --prefix=$(realpath $(pwd)/../install) \
          -v \
          CFLAGS="-D__MSYS__" \
          CXXFLAGS="-D__MSYS__ -Wno-error=unused-but-set-variable" \
          CCASFLAGS="-D__MSYS__" \
          MINGW_CXXFLAGS="-Wno-error=unused-but-set-variable"
        make -j$(nproc)
        make install
        (cd */newlib; make info man)
        (cd */newlib; make install-info install-man)

    - name: Verify crt0.o
      shell: msys2 {0}
      run: |
        echo "=== crt0.o symbols ==="
        nm /usr/lib/crt0.o | grep -i crt0 || true
        if nm /usr/lib/crt0.o | grep -q "cygwin_crt0"; then
          echo "ERROR: crt0.o is from Cygwin not MSYS2"
          exit 1
        else
          echo "OK: crt0.o correctly references msys_crt0"
        fi

    - name: Test
      shell: msys2 {0}
      run: |
        export MAKEFLAGS=-j$(nproc)
        cd build
        # Use fallback if testinst dir doesn't exist yet
        TESTINST=$(realpath ${{ matrix.target }}/winsup/testsuite/testinst/bin 2>/dev/null \
          || echo "${{ matrix.target }}/winsup/testsuite/testinst/bin")
        export PATH="${TESTINST}:${PATH}"
        # Start cygserver in background
        cygpath -wa ${{ matrix.target }}/winsup/cygserver/cygserver \
          | xargs cmd /c &
        cd ${{ matrix.target }}/winsup
        make check AM_COLOR_TESTS=always \
          CFLAGS="-D__MSYS__" \
          CXXFLAGS="-D__MSYS__" \
          CCASFLAGS="-D__MSYS__"

    - name: Upload test logs
      uses: actions/upload-artifact@v4
      with:
        name: testlogs
        path: |
          build/${{ matrix.target }}/winsup/testsuite/**/*.log
          build/${{ matrix.target }}/winsup/testsuite/**/*.trs
      if: ${{ !cancelled() }}

    - name: Avoid actions/checkout post-run step using Cygwin git
      run: bash -c 'rm /usr/bin/git.exe'
      continue-on-error: true